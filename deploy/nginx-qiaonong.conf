server {
    listen 80;
    listen [::]:80;
    server_name zgqnht.com www.zgqnht.com;

    root /srv/qiaonong/app/frontend/dist;
    index index.html;

    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://unix:/run/qiaonong/gunicorn.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(robots\.txt|sitemap\.xml)$ {
        proxy_pass http://unix:/run/qiaonong/gunicorn.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(brand|contact|products|search)/?$ {
        proxy_pass http://unix:/run/qiaonong/gunicorn.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(products|product|policy)/[-a-zA-Z0-9]+/?$ {
        proxy_pass http://unix:/run/qiaonong/gunicorn.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.php {
        proxy_pass http://unix:/run/qiaonong/gunicorn.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/ {
        alias /srv/qiaonong/app/frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /manage/assets/ {
        alias /srv/qiaonong/app/admin-frontend/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /static/ {
        alias /srv/qiaonong/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /srv/qiaonong/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /manage/ {
        alias /srv/qiaonong/app/admin-frontend/dist/;
        try_files $uri $uri/ /manage/index.html;
    }

    location = /manage {
        return 301 /manage/;
    }

    location = / {
        proxy_pass http://unix:/run/qiaonong/gunicorn.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }
}
