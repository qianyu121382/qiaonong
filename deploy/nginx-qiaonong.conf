server {
    listen 80;
    listen [::]:80;
    server_name zgqnht.com www.zgqnht.com;

    root /srv/qiaonong/app/frontend/dist;
    index index.html;

    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://unix:/run/qiaonong/gunicorn.sock:;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /srv/qiaonong/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /srv/qiaonong/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /manage/ {
        alias /srv/qiaonong/app/admin-frontend/dist/;
        try_files $uri $uri/ /manage/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
    }
}
