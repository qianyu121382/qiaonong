name: Checks

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  deployment-templates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: bash -n deploy/qiaonong-cd-dispatch
      - run: bash -n deploy/qiaonong-cd-entrypoint
      - run: python -m py_compile deploy/qiaonong-cd-backup.py
      - name: Validate service security template
        shell: bash
        run: |
          grep -Fxq 'User=qiaonong' deploy/qiaonong.service
          grep -Fxq 'Group=www-data' deploy/qiaonong.service
          grep -Fxq 'UMask=0027' deploy/qiaonong.service
          grep -Fxq 'NoNewPrivileges=true' deploy/qiaonong.service
      - name: Reject unrestricted SSH commands
        shell: bash
        run: |
          set +e
          SSH_ORIGINAL_COMMAND=shell bash deploy/qiaonong-cd-dispatch
          status=$?
          set -e
          [[ "$status" -eq 64 ]]

          set +e
          SSH_ORIGINAL_COMMAND='deploy 0123456789abcdef0123456789abcdef01234567' bash deploy/qiaonong-cd-dispatch
          status=$?
          set -e
          [[ "$status" -eq 69 ]]

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [frontend, admin-frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - working-directory: ${{ matrix.project }}
        run: npm ci
      - working-directory: ${{ matrix.project }}
        run: npm audit --audit-level=high
      - working-directory: ${{ matrix.project }}
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qiaonong_test
          POSTGRES_USER: qiaonong_test
          POSTGRES_PASSWORD: qiaonong_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qiaonong_test -d qiaonong_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ci-only-not-for-production-7f4d9a2c6e8b1f3a5d7c9e2b4f6a8d1c
      POSTGRES_DB: qiaonong_test
      POSTGRES_USER: qiaonong_test
      POSTGRES_PASSWORD: qiaonong_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/dev.lock.txt
      - run: python -m pip install -r requirements/dev.lock.txt
      - run: python manage.py check
      - run: python manage.py check --deploy --settings=config.settings.production
        env:
          DJANGO_ALLOWED_HOSTS: example.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://example.com
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SESSION_COOKIE_SECURE: "true"
          DJANGO_CSRF_COOKIE_SECURE: "true"
          DJANGO_SECURE_HSTS_SECONDS: "31536000"
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
