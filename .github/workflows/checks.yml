name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [frontend, admin-frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - working-directory: ${{ matrix.project }}
        run: npm ci
      - working-directory: ${{ matrix.project }}
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: qiaonong_test
          POSTGRES_USER: qiaonong_test
          POSTGRES_PASSWORD: qiaonong_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qiaonong_test -d qiaonong_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ci-only-secret-key
      POSTGRES_DB: qiaonong_test
      POSTGRES_USER: qiaonong_test
      POSTGRES_PASSWORD: qiaonong_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements/dev.lock.txt
      - run: python -m pip install -r requirements/dev.lock.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
